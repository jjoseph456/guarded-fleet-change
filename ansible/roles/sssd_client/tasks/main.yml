---
- name: Load platform variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Require a supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['RedHat', 'Debian']
    fail_msg: "sssd_client supports RedHat and Debian families only."
    quiet: true

- name: Set the backup directory for this change
  ansible.builtin.set_fact:
    sssd_client_backup_dir: >-
      {{ sssd_client_backup_root }}/{{ fleetguard_change_id | default('manual') }}

- name: Configure SSSD with automatic rollback
  block:
    - name: Create the backup directory
      ansible.builtin.file:
        path: "{{ sssd_client_backup_dir }}"
        state: directory
        mode: "0700"

    - name: Check which identity files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ sssd_client_managed_files }}"
      register: sssd_client_existing

    - name: Back up existing identity files once per change
      ansible.builtin.copy:
        src: "{{ item.stat.path }}"
        dest: "{{ sssd_client_backup_dir }}/{{ item.stat.path | basename }}"
        remote_src: true
        force: false
        mode: preserve
      loop: "{{ sssd_client_existing.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists

    - name: Install SSSD packages
      ansible.builtin.package:
        name: "{{ sssd_client_packages }}"
        state: present

    - name: Render sssd.conf
      ansible.builtin.template:
        src: sssd.conf.j2
        dest: /etc/sssd/sssd.conf
        owner: root
        group: root
        mode: "0600"
      notify: Restart sssd

    - name: Render krb5.conf
      ansible.builtin.template:
        src: krb5.conf.j2
        dest: /etc/krb5.conf
        owner: root
        group: root
        mode: "0644"

    - name: Enable SSSD name service lookups
      ansible.builtin.include_tasks: "nss_{{ ansible_facts['os_family'] }}.yml"

    - name: Remove legacy directory agent packages
      ansible.builtin.package:
        name: "{{ sssd_client_legacy_packages }}"
        state: absent
      when: sssd_client_legacy_packages | length > 0

    - name: Validate the SSSD configuration
      ansible.builtin.command: sssctl config-check
      changed_when: false

    - name: Apply pending service restarts
      ansible.builtin.meta: flush_handlers

    - name: Ensure sssd is running and enabled
      ansible.builtin.service:
        name: sssd
        state: started
        enabled: true
      when: sssd_client_manage_service | bool

  rescue:
    - name: Restore backed-up identity files
      ansible.builtin.copy:
        src: "{{ sssd_client_backup_dir }}/{{ item.item | basename }}"
        dest: "{{ item.item }}"
        remote_src: true
        mode: preserve
      loop: "{{ sssd_client_existing.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat is defined and item.stat.exists

    - name: Remove identity files that did not exist before the change
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: absent
      loop: "{{ sssd_client_existing.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat is defined and not item.stat.exists

    - name: Stop the rollout after rollback
      ansible.builtin.fail:
        msg: >-
          SSSD configuration failed on {{ inventory_hostname }}; original files
          were restored from {{ sssd_client_backup_dir }}.
