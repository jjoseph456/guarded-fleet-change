---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python and sudo on minimal images
      ansible.builtin.raw: |
        if command -v apt-get >/dev/null; then
          command -v python3 >/dev/null && command -v sudo >/dev/null || {
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 sudo
          }
        else
          command -v sudo >/dev/null || dnf install -y sudo
        fi
      changed_when: false

- name: Seed pre-change identity files
  hosts: all
  gather_facts: false
  tasks:
    - name: Record the original nsswitch.conf for rollback checks
      ansible.builtin.command: cp /etc/nsswitch.conf /root/nsswitch.orig
      args:
        creates: /root/nsswitch.orig
