---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: rocky9
    image: rockylinux/rockylinux:9
    pre_build_image: true
    command: sleep infinity
  - name: ubuntu2404
    image: ubuntu:24.04
    pre_build_image: true
    command: sleep infinity
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        fleetguard_change_id: CHG-TEST
        fleetguard_wave: 1
        # Containers have no init system; service management is covered in real waves.
        sssd_client_manage_service: false
        sssd_client_access_groups: [linux-admins]
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
