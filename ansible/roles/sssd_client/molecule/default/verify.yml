---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read sssd.conf metadata
      ansible.builtin.stat:
        path: /etc/sssd/sssd.conf
      register: sssd_client_conf

    - name: Confirm sssd.conf exists with mode 0600
      ansible.builtin.assert:
        that:
          - sssd_client_conf.stat.exists
          - sssd_client_conf.stat.mode == '0600'

    - name: SSSD accepts the rendered configuration
      ansible.builtin.command: sssctl config-check
      changed_when: false

    - name: Read nsswitch passwd line
      ansible.builtin.command: grep -E '^passwd:' /etc/nsswitch.conf
      register: sssd_client_passwd_line
      changed_when: false

    - name: Name service lookups include sss
      ansible.builtin.assert:
        that: "'sss' in sssd_client_passwd_line.stdout"

    - name: Read the original and backed-up nsswitch.conf
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - /root/nsswitch.orig
        - /var/backups/fleetguard/CHG-TEST/nsswitch.conf
      register: sssd_client_nsswitch

    - name: Original nsswitch.conf was backed up for rollback
      ansible.builtin.assert:
        that:
          - sssd_client_nsswitch.results[1].stat.exists
          - sssd_client_nsswitch.results[0].stat.checksum == sssd_client_nsswitch.results[1].stat.checksum

    - name: Access is restricted to the configured group
      ansible.builtin.command: grep -q 'simple_allow_groups = linux-admins' /etc/sssd/sssd.conf
      changed_when: false

    - name: Read the pre-change manifest
      ansible.builtin.slurp:
        src: /var/backups/fleetguard/CHG-TEST/pre-change-manifest.json
      register: sssd_client_manifest

    - name: Manifest reflects the host before the change, not after
      vars:
        sssd_client_original: "{{ sssd_client_manifest.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - "'/etc/nsswitch.conf' in sssd_client_original"
          - "'/etc/sssd/sssd.conf' not in sssd_client_original"
