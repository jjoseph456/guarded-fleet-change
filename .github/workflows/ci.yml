name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  ansible-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[ansible]"
      - run: ansible-playbook -i inventory/synthetic/hosts.ini ansible/playbooks/sssd_migration.yml --syntax-check
      - run: ansible-lint --offline ansible/

  molecule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[ansible,molecule]"
      - run: ansible-galaxy collection install -r requirements.yml
      - name: Converge, idempotence, and verify on Rocky 9 and Ubuntu 24.04
        working-directory: ansible/roles/sssd_client
        env:
          ANSIBLE_FORCE_COLOR: "1"
        run: molecule test

  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install workflow auditor at a pinned commit
        run: >-
          python -m pip install
          "github-actions-workflow-auditor @ git+https://github.com/jjoseph456/github-actions-workflow-auditor@b2a2e460e87d947fd68eee383dd8ca24acf3e837"
      - name: Audit this repository's workflows
        run: workflow-audit . --fail-on low
